<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mmail</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  height: 100vh;
  background: #f1f3f4;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  background: #202124;
  color: white;
  padding: 12px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border: none;
  background: #1a73e8;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

/* INBOX */
.main {
  flex: 1;
  overflow: auto;
}

.email {
  background: white;
  margin: 8px;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
}

.email:hover {
  background: #e8f0fe;
}

.subject {
  font-weight: bold;
}

/* COMPOSE */
.compose {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 360px;
  background: white;
  border-radius: 10px;
  padding: 10px;
  display: none;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

input, textarea {
  width: 100%;
  margin-top: 6px;
  padding: 8px;
}
</style>
</head>

<body>

<div class="sidebar">
  <h3>Mmail</h3>
  <button onclick="login()">Login</button>
  <button onclick="load()">Refresh</button>
  <button onclick="openCompose()">Compose</button>
</div>

<div class="main" id="inbox"></div>

<div class="compose" id="compose">
  <input id="to" placeholder="To">
  <input id="subject" placeholder="Subject">
  <textarea id="body" placeholder="Message"></textarea>
  <button onclick="send()">Send</button>
</div>

<script type="module">
const API = "https://mmail-production.up.railway.app";

/* ---------------- LOAD EMAILS ---------------- */
window.load = async () => {
  const res = await fetch(API + "/emails");
  const data = await res.json();

  const inbox = document.getElementById("inbox");
  inbox.innerHTML = "";

  data.forEach(mail => {
    const div = document.createElement("div");
    div.className = "email";

    div.innerHTML = `
      <div>
        <div class="subject">${mail.subject}</div>
        <div>${mail.from || mail.to}</div>
      </div>
      <div>${new Date(mail.timestamp).toLocaleString()}</div>
    `;

    div.onclick = () => openMail(mail);

    inbox.appendChild(div);
  });
};

/* ---------------- OPEN EMAIL ---------------- */
window.openMail = (mail) => {
  const w = window.open();

  w.document.write(`
    <h2>${mail.subject}</h2>
    <iframe 
      sandbox 
      style="width:100%;height:90vh;border:none"
      srcdoc="${mail.html.replace(/"/g, '&quot;')}">
    </iframe>
  `);
};

/* ---------------- COMPOSE ---------------- */
window.openCompose = () => {
  document.getElementById("compose").style.display = "block";
};

window.send = async () => {
  await fetch(API + "/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      to: to.value,
      subject: subject.value,
      body: body.value
    })
  });

  document.getElementById("compose").style.display = "none";
  load();
};

/* fake login placeholder */
window.login = () => {
  alert("Auth handled by Firebase (already set up)");
};

load();
</script>

</body>
