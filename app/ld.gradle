plugins {
    id 'com.android.application'
}

android {
    namespace "com.mmail.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.mmail.app"
        minSdk 21
        targetSdk 34

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
